<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Completa tu perfil - Agro-Merge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../eCommerceAssets/styles/Completar-Productos.css">
</head>
<body>

    <div class="split-layout">
        
        <div class="left-panel">
            <div class="form-container">
                
                <div class="brand-logo">
                    <div class="logo-placeholder">
                        <i class="fas fa-seedling"></i>
                    </div>
                    <span class="brand-text">Agro-Merge</span>
                </div>

                <div class="header-texts">
                    <h1>Completa tu perfil</h1>
                    <p>Selecciona tu o tus productos a la venta</p>
                </div>

                <div class="products-grid">
                    <button class="product-pill">Maíz</button>
                    
                    <button class="product-pill">Café</button>
                    <button class="product-pill">Tomate</button>
                    <button class="product-pill">Cacao</button>
                    
                    <button class="product-pill">Frijol</button>
                    
                    <button class="product-pill">Papa</button>
                    <button class="product-pill">Zanahoria</button>
                    <button class="product-pill">Cebolla</button>
                    
                    <button class="product-pill">Gallinas</button>
                    
                    <button class="product-pill">Cerdos</button>
                    <button class="product-pill">Huevos</button>
                    <button class="product-pill">Leche</button>
                    
                    <button class="product-pill add-btn">Añadir</button>
                </div>

                <button class="continue-btn">Continuar</button>
            </div>

            <div class="panel-footer">
                <span>Todos los derechos reservados © Agromerge</span>
                <a href="#">Política de Privacidad</a>
            </div>
        </div>

        <div class="right-panel">
            <img src="../../eCommerceAssets/img/image-regislog.png" alt="Agricultores trabajando en el campo">
        </div>

    </div> 
    
    <script src="/Interfaz/pages/js/Completar-Productos.js"></script>

</body>
</html>
