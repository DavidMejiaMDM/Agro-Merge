<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agrega tus productos - Agro-Merge</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* ==============================================
           VARIABLES GLOBALES
        ============================================== */
        :root {
            --green-dark: #1b5e20;
            --green-gradient-start: #388e3c;
            --green-gradient-end: #7cb342;
            --border-color: #cdd4ed;
            --border-focus: #4caf50;

            --text-dark: #111111;
            --text-label: #222222;
            --text-gray: #777777;
            --text-light: #999999;

            --font-heading: "Poppins", sans-serif;
            --font-body: "Inter", sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: #ffffff;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .page-wrapper {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            width: 100%;
            max-width: 600px;
            padding: 40px 20px;
            min-height: 100vh;
        }

        .form-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px 0;
        }

        /* ==============================================
           CABECERA Y LOGO
        ============================================== */
        .header-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .brand-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            margin-bottom: 25px;
        }

        .logo-placeholder {
            width: 35px;
            height: 35px;
            background-color: #fdf6e3;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #d4a373;
            border: 1px solid #eaddcf;
            font-size: 14px;
        }

        .brand-text {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
        }

        .header-section h1 {
            font-family: var(--font-heading);
            font-size: 26px;
            font-weight: 700;
            color: var(--text-dark);
            margin-bottom: 8px;
        }

        .header-section p {
            font-size: 15px;
            color: var(--text-gray);
        }

        /* ==============================================
           FORMULARIO
        ============================================== */
        .product-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-family: var(--font-heading);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-label);
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 12px 20px;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            font-family: var(--font-body);
            font-size: 14px;
            color: var(--text-dark);
            background-color: transparent;
            transition: all 0.3s ease;
            outline: none;
        }

        .input-group input::placeholder {
            color: #a0a0a0;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: var(--border-focus);
            box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.1);
        }

        .select-wrapper {
            position: relative;
        }

        .select-wrapper select {
            appearance: none;
            cursor: pointer;
        }

        .select-icon {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--green-dark);
            pointer-events: none;
            font-size: 12px;
        }

        /* ==============================================
           BOTONES SECUNDARIOS
        ============================================== */
        .secondary-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 15px;
            margin-top: 5px;
            margin-bottom: 10px;
        }

        .btn-outline {
            background-color: transparent;
            color: var(--text-label);
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 10px 24px;
            font-family: var(--font-body);
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .btn-outline i {
            color: var(--text-gray);
            font-size: 14px;
        }

        .btn-outline:hover {
            background-color: #f4f6fc;
            border-color: #b0b9db;
        }

        /* ==============================================
           BOTÓN PRINCIPAL
        ============================================== */
        .btn-primary {
            width: 100%;
            background: linear-gradient(90deg, var(--green-gradient-start) 0%, var(--green-gradient-end) 100%);
            color: #ffffff;
            border: none;
            border-radius: 30px;
            padding: 15px;
            font-family: var(--font-heading);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(56, 142, 60, 0.2);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(56, 142, 60, 0.3);
        }

        .bottom-text {
            text-align: center;
            color: var(--text-light);
            font-size: 13px;
            margin-top: 5px;
        }

        /* ==============================================
           FOOTER
        ============================================== */
        .page-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11px;
            color: var(--text-light);
            padding-top: 20px;
        }

        .page-footer a {
            color: var(--text-light);
            text-decoration: none;
            transition: color 0.2s;
        }

        .page-footer a:hover {
            color: var(--text-gray);
            text-decoration: underline;
        }

        @media (max-width: 480px) {
            .page-footer {
                flex-direction: column;
                gap: 10px;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="page-wrapper">
        <div class="form-container">
            <div class="header-section">
                <div class="brand-logo">
                    <div class="logo-placeholder">
                        <i class="fas fa-seedling"></i>
                    </div>
                    <span class="brand-text">Agro-Merge</span>
                </div>
                <h1>Completa tu perfil</h1>
                <p>Agrega tus productos y precios</p>
            </div>

            <form class="product-form" id="formulario_producto">
                <div class="input-group">
                    <label for="nombre_producto">Nombre del producto</label>
                    <input type="text" id="nombre_producto" placeholder="Ej. Maíz dulce" required />
                </div>

                <div class="input-group">
                    <label for="precio">Precio</label>
                    <input type="text" id="precio" placeholder="Ej. 1500" required />
                </div>

                <div class="input-group">
                    <label for="tipo_venta">Tipo de venta</label>
                    <div class="select-wrapper">
                        <select id="tipo_venta" required>
                            <option value="" disabled selected>Selecciona el tipo</option>
                            <option value="LB/UND">LB/UND</option>
                            <option value="KG">Kilogramo (KG)</option>
                            <option value="Bulto">Bulto / Saco</option>
                            <option value="Caja">Caja</option>
                        </select>
                        <i class="fas fa-chevron-down select-icon"></i>
                    </div>
                </div>

                <div class="secondary-actions">
                    <input type="file" id="input_imagen_oculto" accept="image/png, image/jpeg, image/jpg" style="display: none;" />

                    <button type="button" class="btn-outline" id="btn_subir_imagen">
                        <i class="fas fa-image"></i> <span id="texto_btn_imagen">Subir imagen</span>
                    </button>

                    <button type="button" class="btn-outline" id="btn_anadir_extra">
                        <i class="fas fa-plus"></i> Añadir producto
                    </button>
                </div>

                <button type="submit" class="btn-primary">Finalizar</button>
                <p class="bottom-text">Agrega tus productos y precios</p>
            </form>
        </div>

        <footer class="page-footer">
            <span>Todos los derechos reservados © Agromerge</span>
            <a href="#">Política de Privacidad</a>
        </footer>
    </div>

    <script src="/pages/js/Agregar-Productos.js"></script>
</body>
</html>
