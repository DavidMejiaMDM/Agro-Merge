<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Agro-Merge | Recuperar Contraseña</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <link href="../../eCommerceAssets/styles/styles.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="styles-layout">
    <main class="styles-panel">
      
      <header class="styles-panel__header">
        <div class="logo">
          <img src="../../eCommerceAssets/img/logo.png" alt="Agro-Merge" class="logo__img" />
          <span class="logo__text">Agro-Merge</span>
        </div>
      </header>

      <section class="styles-panel__body">
        <h1 class="styles-title">¿Olvidaste tu contraseña?</h1>
        <p class="styles-subtitle">
          Escribe el correo electrónico asociado a tu cuenta y te enviaremos un código para recuperar el acceso.
        </p>

        <form class="form" action="http://localhost:3000/recover-password" method="POST">
          <div class="form-group">
            <label for="email">Correo</label>
            <input 
              id="email" 
              type="email" 
              name="correo_usuario" 
              placeholder="user@gmail.com" 
              required 
            />
          </div>

          <button class="btn btn--primary" type="submit">Continuar</button>
          
          <p class="styles-footer-text">
            ¿Recordaste tu contraseña? 
            <a href="../Login/login.html" class="link">Regresar al Login</a>
          </p>
        </form>
      </section>

      <footer class="styles-panel__footer">
        <span>Todos los derechos reservados © Agromerge</span>
        <a href="#" class="link-footer">Política de Privacidad</a>
      </footer>
    </main>

    <aside class="styles-image"></aside>
  </div>
	
	<script>
  const form = document.querySelector('.form');
  form.addEventListener('submit', () => {
    const email = document.getElementById('email').value;
    // Guardamos el correo para que la siguiente pantalla lo reconozca
    localStorage.setItem('userEmail', email);
  });
</script>
</body>
</html>
