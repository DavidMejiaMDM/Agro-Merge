<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Configura tu nueva contraseña - Agro-Merge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  
  <link rel="stylesheet" href="./styles.css">
  <link href="../../eCommerceAssets/styles/styles.css" rel="stylesheet" type="text/css">
</head>
<body>
  <div class="styles-layout">
    <main class="styles-panel">
      
      <header class="styles-panel__header">
        <div class="logo">
          <img src="../../eCommerceAssets/img/logo.png" alt="Agro-Merge" class="logo__img" />
          <span class="logo__text">Agro-Merge</span>
        </div>
      </header>

      <section class="styles-panel__body">
        <h1 class="styles-title">Configura tu nueva contraseña</h1>
        <p class="styles-subtitle">
          Crea una contraseña segura, fácil de recordar y difícil de adivinar.
        </p>

        <form class="form" id="resetPasswordForm" action="http://localhost:3000/update-password" method="POST">
          
          <input type="hidden" name="correo_usuario" id="hiddenEmail">

          <div class="form-group">
            <label for="new_password">Contraseña nueva</label>
            <input 
              id="new_password" 
              type="password" 
              name="nueva_clave" 
              placeholder="********" 
              required 
              minlength="6"
            />
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirmar contraseña</label>
            <input 
              id="confirm_password" 
              type="password" 
              placeholder="********" 
              required 
            />
          </div>

          <p id="errorMessage" style="color: #dc2626; font-size: 0.85rem; display: none; margin-top: -10px; margin-bottom: 15px;">
            Las contraseñas no coinciden. Inténtalo de nuevo.
          </p>

          <button class="btn btn--primary" type="submit">Continuar</button>
        </form>
      </section>

      <footer class="styles-panel__footer">
        <span>Todos los derechos reservados © Agromerge</span>
        <a href="#" class="link-footer" style="text-decoration: none; color: inherit;">Política de Privacidad</a>
      </footer>
    </main>

    <aside class="styles-image"></aside>
  </div>

  <script>
    // 1. Recuperamos el correo que guardamos en la primera pantalla
    window.onload = function() {
      const savedEmail = localStorage.getItem('userEmail');
      if (savedEmail) {
        document.getElementById('hiddenEmail').value = savedEmail;
      } else {
        console.warn("No se encontró el correo del usuario en localStorage.");
      }
    };

    // 2. Validación para asegurar que las contraseñas coincidan
    const form = document.getElementById('resetPasswordForm');
    const newPassword = document.getElementById('new_password');
    const confirmPassword = document.getElementById('confirm_password');
    const errorMessage = document.getElementById('errorMessage');

    form.addEventListener('submit', function(event) {
      if (newPassword.value !== confirmPassword.value) {
        // Si no son iguales, detenemos el envío del formulario y mostramos el error
        event.preventDefault(); 
        errorMessage.style.display = 'block';
        confirmPassword.style.borderColor = '#dc2626'; // Borde rojo
      } else {
        // Si todo está bien, ocultamos el error y dejamos que el form haga el POST
        errorMessage.style.display = 'none';
        confirmPassword.style.borderColor = '#ccc';
        
        // Opcional: Limpiar el localStorage si ya no lo necesitamos
        // localStorage.removeItem('userEmail'); 
      }
    });
  </script>
</body>
</html>
