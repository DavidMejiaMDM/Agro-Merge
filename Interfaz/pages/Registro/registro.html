<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Registro - Agro-Merge</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="styles.css" />
  <link href="../../eCommerceAssets/styles/styles.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="styles-layout">
    <main class="styles-panel">
      <header class="styles-panel__header">
        <div class="logo">
          <img src="../../eCommerceAssets/img/logo.png" alt="Agro-Merge" class="logo__img" />
          <span class="logo__text">Agro-Merge</span>
        </div>
      </header>

      <section class="styles-panel__body">
        <h1 class="styles-title">Crea tu cuenta</h1>
        <p class="styles-subtitle">Regístrate y empieza a comprar o vender.</p>

        <div class="role-tabs">
          <input type="radio" id="tab-comprador" name="rol-tab" checked />
          <input type="radio" id="tab-vendedor" name="rol-tab" />
          <input type="radio" id="tab-empresa" name="rol-tab" />

          <div class="role-tabs__headers">
            <label for="tab-comprador" class="role-tabs__tab">Comprador</label>
            <label for="tab-vendedor" class="role-tabs__tab">Vendedor</label>
            <label for="tab-empresa" class="role-tabs__tab">Empresa</label>
          </div>

          <div class="role-tabs__content">
            <!-- COMPRADOR -->
            <div class="role-pane role-pane--comprador">
              <form class="form" action="http://localhost:3000/registro" method="POST" novalidate>
                <input type="hidden" name="rol_usuario" value="comprador" />

                <div class="form-group">
                  <label for="nombre_comprador">Nombre</label>
                  <input id="nombre_comprador" type="text" name="nombre_usuario" placeholder="Nombre completo" required />
                </div>

                <div class="form-group">
                  <label for="tipo_doc_comprador">Tipo Documento</label>
                  <input id="tipo_doc_comprador" type="text" value="Cédula de Ciudadanía" class="input-readonly" readonly />
                </div>

                <div class="form-group">
                  <label for="documento_comprador">Documento</label>
                  <input id="documento_comprador" type="text" name="documento_usuario" placeholder="0123456789" required />
                </div>

                <div class="form-row-2">
                  <div class="form-group">
                    <label for="prefijo_comprador">Prefijo</label>
                    <input id="prefijo_comprador" type="text" value="+57" class="input-readonly" readonly />
                  </div>
                  <div class="form-group">
                    <label for="telefono_comprador">Celular</label>
                    <input id="telefono_comprador" type="tel" name="telefono_usuario" placeholder="3137777777" required />
                  </div>
                </div>

                <div class="form-group">
                  <label for="correo_comprador">Correo</label>
                  <input id="correo_comprador" type="email" name="correo_usuario" placeholder="usuario@gmail.com" required />
                </div>

                <div class="form-group">
                  <label for="clave_comprador">Contraseña</label>
                  <input id="clave_comprador" type="password" name="clave_usuario" placeholder="********" required />
                </div>

                <div class="form-group">
                  <label for="confirmar_clave_comprador">Verificar Contraseña</label>
                  <input id="confirmar_clave_comprador" type="password" name="confirmar_clave_usuario" placeholder="********" required />
                </div>

                <button type="submit" class="btn btn--primary">Registrarse</button>

                <p class="styles-footer-text">
                  ¿Ya tienes una cuenta?
                  <a href="../Login/login.html" class="link">Inicia sesión</a>
                </p>
              </form>
            </div>

            <!-- VENDEDOR -->
            <div class="role-pane role-pane--vendedor">
              <form class="form" action="http://localhost:3000/registro" method="POST" novalidate>
                <input type="hidden" name="rol_usuario" value="vendedor" />

                <div class="form-group">
                  <label for="nombre_vendedor">Nombre</label>
                  <input id="nombre_vendedor" type="text" name="nombre_usuario" placeholder="Nombre vendedor" required />
                </div>

                <div class="form-group">
                  <label for="tipo_doc_vendedor">Tipo Documento</label>
                  <input id="tipo_doc_vendedor" type="text" value="Cédula de Ciudadanía" class="input-readonly" readonly />
                </div>

                <div class="form-group">
                  <label for="documento_vendedor">Documento</label>
                  <input id="documento_vendedor" type="text" name="documento_usuario" placeholder="0123456789" required />
                </div>

                <div class="form-row-2">
                  <div class="form-group">
                    <label for="prefijo_vendedor">Prefijo</label>
                    <input id="prefijo_vendedor" type="text" value="+57" class="input-readonly" readonly />
                  </div>
                  <div class="form-group">
                    <label for="telefono_vendedor">Celular</label>
                    <input id="telefono_vendedor" type="tel" name="telefono_usuario" placeholder="3000000000" required />
                  </div>
                </div>

                <div class="form-group">
                  <label for="correo_vendedor">Correo</label>
                  <input id="correo_vendedor" type="email" name="correo_usuario" placeholder="vendedor@gmail.com" required />
                </div>

                <div class="form-group">
                  <label for="clave_vendedor">Contraseña</label>
                  <input id="clave_vendedor" type="password" name="clave_usuario" placeholder="********" required />
                </div>

                <div class="form-group">
                  <label for="confirmar_clave_vendedor">Verificar Contraseña</label>
                  <input id="confirmar_clave_vendedor" type="password" name="confirmar_clave_usuario" placeholder="********" required />
                </div>

                <button type="submit" class="btn btn--primary">Registrarse como vendedor</button>

                <p class="styles-footer-text">
                  ¿Ya tienes una cuenta?
                  <a href="../Login/login.html" class="link">Inicia sesión</a>
                </p>
              </form>
            </div>

            <!-- EMPRESA -->
            <div class="role-pane role-pane--empresa">
              <form class="form" action="http://localhost:3000/registro" method="POST" novalidate>
                <input type="hidden" name="rol_usuario" value="empresa" />

                <div class="form-group">
                  <label for="nombre_empresa">Nombre de la empresa</label>
                  <input id="nombre_empresa" type="text" name="nombre_usuario" placeholder="Razón social" required />
                </div>

                <div class="form-group">
                  <label for="nit_empresa">NIT</label>
                  <input id="nit_empresa" type="text" name="documento_usuario" placeholder="900123456" required />
                </div>

                <div class="form-group">
                  <label for="telefono_empresa">Celular</label>
                  <input id="telefono_empresa" type="tel" name="telefono_usuario" placeholder="3000000000" required />
                </div>

                <div class="form-group">
                  <label for="correo_empresa">Correo</label>
                  <input id="correo_empresa" type="email" name="correo_usuario" placeholder="contacto@empresa.com" required />
                </div>

                <div class="form-group">
                  <label for="clave_empresa">Contraseña</label>
                  <input id="clave_empresa" type="password" name="clave_usuario" placeholder="********" required />
                </div>

                <div class="form-group">
                  <label for="confirmar_clave_empresa">Verificar Contraseña</label>
                  <input id="confirmar_clave_empresa" type="password" name="confirmar_clave_usuario" placeholder="********" required />
                </div>

                <button type="submit" class="btn btn--primary">Registrarse como empresa</button>

                <p class="styles-footer-text">
                  ¿Ya tienes una cuenta?
                  <a href="../Login/login.html" class="link">Inicia sesión</a>
                </p>
              </form>
            </div>
          </div>
        </div>
      </section>

      <footer class="styles-panel__footer">
        <span>Todos los derechos reservados © Agromerge</span>
        <span>Política de Privacidad</span>
      </footer>
    </main>

    <aside class="styles-image"></aside>
  </div>

  <script src="../js/registro.js"></script>
</body>
</html>
