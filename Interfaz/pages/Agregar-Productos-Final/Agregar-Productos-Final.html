<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tus Productos - Agro-Merge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="/Interfaz/eCommerceAssets/styles/Agregar-Productos-Final.css">
</head>
<body>

    <div class="page-wrapper">
        
        <div class="main-content">
            <div class="header-section">
                <div class="brand-logo">
                    <div class="logo-placeholder">
                        <i class="fas fa-seedling"></i>
                    </div>
                    <span class="brand-text">Agro-Merge</span>
                </div>
                <h1>Completa tu perfil</h1>
                <p>Agrega tus productos y precios</p>
            </div>

            <div class="products-grid" id="contenedor-productos">
                </div>

            <div class="actions-container">
                <button type="button" class="btn-add" id="btn_anadir_mas">Añadir</button>
                <button type="button" class="btn-primary" id="btn_continuar">Continuar</button>
                <p class="bottom-text">Agrega tus productos y precios</p>
            </div>
        </div>

        <footer class="page-footer">
            <span>Todos los derechos reservados © Agromerge</span>
            <a href="#">Política de Privacidad</a>
        </footer>

        <div class="floating-support">
            <span>S</span>
        </div>

    </div>

    <script src="/Interfaz/pages/js/Agregar-Productos-Final.js"></script>
</body>
</html>
