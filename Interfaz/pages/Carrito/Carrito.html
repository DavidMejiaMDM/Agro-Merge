<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Carrito - Agro-Merge</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../eCommerceAssets/styles/carrito.css">
</head>
<body>
    
    <header> 
        <div class="logo">
            <img src="../../eCommerceAssets/img/logo.png" alt="Agro-Merge" class="logo__img" />
            <span class="logo__text">Agro-Merge</span>
        </div>

        <div id="headerLinks">
            <a href="../Productos/Productos.html" title="Productos">Productos</a>
            <a href="#" title="Noticias">Noticias</a>
            <a href="../Contactos/Contactos.html">Contacto</a>
        </div>
            
        <div class="search-container">
            <input type="search" placeholder="Buscar un producto..." class="search-input">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
        </div>
    </header>

    <div class="contenedor-carrito">
        <h2 class="titulo-carrito">Mi carrito <span id="cantidad-titulos">(0 productos)</span></h2>

        <div class="layout-carrito">
            
            <div class="seccion-productos">
                <div class="encabezados-tabla">
                    <div>Producto</div>
                    <div>Cantidad</div>
                    <div>Total</div>
                    <div>Acciones</div>
                </div>
                <div id="contenedor-items-pagina"></div>
            </div>

            <div class="seccion-resumen">
                <h3>Orden</h3>
                
                <div class="cupon-box">
                    <input type="text" placeholder="Ingresa un cupón">
                    <button>Aplicar</button>
                </div>

                <div class="linea-resumen">
                    <span>Subtotal</span>
                    <span id="pagina-subtotal">$0</span>
                </div>
                <div class="linea-resumen">
                    <span>Envío</span>
                    <span id="pagina-envio">$7.900</span>
                </div>
                <div class="linea-resumen total">
                    <span>Total</span>
                    <span id="pagina-total">$0</span>
                </div>

                <button class="btn-bloque btn-pagar" onclick="procesarPago()">Proceder al Pago</button>
                <a href="../Productos/Productos.html" class="btn-bloque btn-continuar">Continuar Comprando</a>
            </div>

        </div>
    </div>

    <script src="../js/carrito.js"></script>
</body>
</html>
